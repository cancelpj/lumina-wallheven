[package]
name = "app"
version = "0.1.0"
description = "Wallhaven Desktop - A beautiful wallpaper browser"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "6"
opener = { version = "0.8", features = ["reveal"] }

# Bounded thumbnail generation, so the webview never has to decode a full
# resolution wallpaper.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }

# Windows-specific: setting the desktop wallpaper goes straight through Win32
# (registry + SystemParametersInfoW) instead of shelling out to PowerShell.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
